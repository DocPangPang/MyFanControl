name: Build modern preview

on:
  push:
    branches: [main]
    paths:
      - "src/MyFanControl.Modern/**"
      - ".github/workflows/build-modern.yml"
  pull_request:
    paths:
      - "src/MyFanControl.Modern/**"
      - ".github/workflows/build-modern.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build x86 release
        run: dotnet build .\src\MyFanControl.Modern\MyFanControl.Modern.csproj -c Release -p:Platform=x86
